name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Enables a manual 1-click "Run workflow" button in the GitHub UI

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Java 17 with Gradle caching
      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Setup Flutter SDK with package caching
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      # Step 4: Inject or mock google-services.json for Firebase compilation
      - name: Restore or Mock google-services.json
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
            echo "Injected production google-services.json from GitHub Secrets"
          else
            echo "Generating fallback google-services.json for build verification"
            cat <<EOF > android/app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "whisper-text-app",
              "storage_bucket": "whisper-text-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.whisper.whisper_text"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyFakePlaceholderKeyForBuild000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      # Step 5: Fetch Flutter dependencies
      - name: Install Pub Dependencies
        run: flutter pub get

      # Step 6: Validate Dart code syntax & imports
      - name: Run Dart Analysis
        run: flutter analyze --no-fatal-infos

      # Step 7: Build Universal Release APK
      - name: Build Universal Release APK
        run: flutter build apk --release

      # Step 8: Build Split Architecture APKs (arm64-v8a, armeabi-v7a - ~60% smaller file size)
      - name: Build Split ABI APKs
        run: flutter build apk --release --split-per-abi

      # Step 9: Upload Universal APK as downloadable artifact
      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: whisper-text-universal-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Step 10: Upload Split APKs as downloadable artifacts
      - name: Upload Split Architecture APKs
        uses: actions/upload-artifact@v4
        with:
          name: whisper-text-split-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30
